[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["preprocessing*", "shared*", "v1*", "v2*", "db*", "ego_trap*"]

[project]
name = "narens-brain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "pinecone>=5.0",
    "spacy>=3.7",
    "google-genai>=0.8",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "bertopic>=0.16",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # Ask Naren's HTTP server only (issue #31). A SERVER, not a web framework -- the
    # service stays a plain ASGI callable, so ADR 0003's "there is nothing here a framework
    # would do" still holds. Nothing in the pipeline imports it.
    #
    # Install with uv; this venv has no pip:
    #   uv pip install --python .venv/Scripts/python.exe uvicorn
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]
