[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["preprocessing*", "shared*", "v1*", "v2*", "db*", "ego_trap*"]

[project]
name = "narens-brain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "pinecone>=5.0",
    "spacy>=3.7",
    "google-genai>=0.8",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "bertopic>=0.16",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # Ask Naren's HTTP layer only. uvicorn is the server (issue #31); FastAPI is the
    # framework, since 2026-09-29 -- reversing #31's "no framework" -- so the contract is a
    # schema at /docs. Still ONE process, one loop, never --workers (ADR 0010). Nothing in
    # the pipeline imports either.
    #
    # Install with uv; this venv has no pip:
    #   uv pip install --python .venv/Scripts/python.exe uvicorn fastapi
    "uvicorn>=0.30",
    "fastapi>=0.141",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]
