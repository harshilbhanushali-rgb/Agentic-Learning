# Brain pipeline tuning parameters.
#
# Every threshold the clustering / milestone pipeline depends on lives here.
# Change values in this file only -- no code edit is needed.
#
# Loaded by shared/tuning.py. Unknown or missing keys raise an error at load
# time rather than being silently ignored, so a typo here fails loudly instead
# of quietly reverting to a default you thought you had changed.
#
# Calibrate with:
#     python dry_run_layer_a.py --sweep     # compare many thresholds at once
#     python dry_run_layer_a.py             # full report for the values below
# Neither makes a Gemma call nor writes to the database.

layer_a:
  # Minimum distinct-call support, as a FRACTION of the corpus.
  #
  # MEASURED: this lever is inert at 416 calls. Across the whole sweep grid it
  # dropped 0-3 clusters out of 226, because BERTopic's min_cluster_size is
  # already 50 clauses at this corpus size, so every surviving cluster trivially
  # spans many calls. Kept as a safety floor for small corpora -- do NOT credit
  # it with removing junk. It does not.
  min_call_support_fraction: 0.02

  # Absolute floor, for small corpora where the fraction rounds to nothing.
  # Effective requirement is max(floor, ceil(fraction * total_calls)).
  min_call_support_floor: 4

  # Coverage above which a cluster is FLAGGED for LLM review -- not rejected.
  #
  # This used to auto-classify a cluster as mechanics. That was wrong: at every
  # operating point it condemned ~50% of the taxonomy, because a core business
  # topic legitimately appears in most calls and coverage alone cannot tell it
  # apart from backchannel. Now high coverage only attaches a warning and the
  # cluster's stats to the Gemma prompt, and the LLM decides.
  #
  # MEASURED over 171 merged clusters at merge=0.85 (416 calls):
  #   p10=10%  p25=12%  p50=20%  p75=35%  p90=56%  p95=64%  p99=72%  max=74%
  # 0.60 sits between p90 and p95 and flags 15 of 171 clusters (9%) -- an audit
  # minority, which is the point. The old 0.25 sat below p75 and would have
  # flagged well over a third of the taxonomy.
  #
  # Those 15 are exactly the ambiguous band, and they prove why this must not
  # auto-reject: 11 are junk (thanks/appreciate 73%, greetings 68%, okay/fine
  # 64%, nice/good/great 64%, yeah/yes/yep 64%, dont-know 61%, look/seen 60%,
  # moving-forward 61%, weekday names 67%, month names 69%, call-scheduling 61%)
  # but 4 are real business topics (budget/spend/cost 74%, client/customer/sales
  # 72%, API/XML/SFTP integration 64%, and the Joveo entity itself 63%). Under
  # the old auto-mechanics rule, budget-and-cost would have been DELETED from the
  # taxonomy for being too common.
  #
  # Set it in the upper tail of the observed distribution. Re-read the
  # CALL-COVERAGE DISTRIBUTION block from dry_run_layer_a.py after ANY change to
  # merge_cosine_threshold -- merging unions call sets and shifts this whole
  # distribution upward.
  ubiquity_ceiling: 0.60

  # Two clusters whose centroids are at least this cosine-similar are the same
  # scenario and get merged. Replaces the old MAX_CLUSTERS=150 count cap, which
  # merged the RAREST clusters first by keyword overlap -- the opposite end of
  # the distribution from the backchannel families that actually duplicate.
  #
  # MEASURED at 0.70 / 0.75 / 0.80 / 0.85 by inspecting the actual merge groups
  # (python dry_run_layer_a.py --merge-detail 0.70,0.75,0.80,0.85):
  #   0.70 -> 26 groups   collapses nearly the whole corpus into 26 buckets
  #   0.80 -> 119 groups  STILL over-merges: one group fused campaigns + sales
  #                       team + brand + markets + vendors; another fused job
  #                       boards + career sites + resumes + job descriptions
  #   0.85 -> 162 groups  correctly unifies the duplicate families
  #                       (thanks/appreciate, okay/fine/alright, calendar +
  #                       scheduling, email + slack, city/country/region) while
  #                       leaving distinct business topics separate
  # Below ~0.85 the centroids of large clause sets converge toward a generic
  # "conversation" direction, so aggressive merging destroys real distinctions
  # before it removes duplicates. Lower = more aggressive merging.
  merge_cosine_threshold: 0.85

  # Cheap pre-filter: minimum non-stopword alphabetic tokens for a clause to
  # enter the pool. Removes bare "Perfect." / "Yeah." only -- deliberately NOT
  # the primary defence against generic text.
  min_content_words: 5

  # MEASURED 2026-07-30 (python dry_run_layer_a.py --grouping-compare, full
  # 416-call corpus, zero Gemma calls -- judged by reading actual c-TF-IDF
  # keyword groups, not by counting groups, same convention as merge_detail
  # above). 'post_hoc' merges already-adjudicated subtopic centroids after the
  # main loop finishes; 'nested' merges RAW topic centroids into macro-groups
  # FIRST, then subtopic-merges within each one (see shared/topic_grouping.py).
  #
  #   loose   post_hoc groups (top size)   nested groups (top size)
  #   0.55        2  (170)                     3  (168)
  #   0.60        6  (153)                      8  (147)
  #   0.65       13  (125)                     17  (121)
  #   0.70       29   (93)                     31   (92)
  #   0.75       56   (26)                     68   (21)
  #   0.80      101   (13)                    118    (5)
  #
  # Below ~0.70 BOTH methods collapse into one indiscriminate mega-group fusing
  # budget/spend, Joveo-brand mentions, sales-role mentions, and calendar dates
  # into a single "primary topic" -- the same centroids-converge-toward-a-
  # generic-direction failure merge_cosine_threshold's own calibration already
  # documents below 0.85, reappearing one level up the hierarchy. Above ~0.80
  # both start FRAGMENTING families that clearly belong together (okay/yeah/
  # appreciate/thanks/dont-know backchannel splits into isolated 2-member pairs
  # instead of staying one umbrella).
  #
  # 0.75 is the sweet spot for both: the residual mixed-topic blob shrinks to a
  # plausible "recruitment/product-domain terminology" umbrella (26 / 21
  # members) while scheduling, AI/automation, communication-logistics,
  # positive-sentiment and difficulty/concern all separate into coherent,
  # individually-nameable groups. nested wins over post_hoc at that threshold:
  # its residual blob is smaller (21 vs 26 members), and it recovers real
  # distinctions post_hoc's two-step process misses -- e.g. a clean 5-member
  # scheduling/timezone group, and an AI+automation group that captures
  # "programmatic advertising" (a real Joveo product term) where post_hoc's
  # version does not.
  #
  # CAVEAT: this compares c-TF-IDF keyword clusters BEFORE Gemma adjudication,
  # the same limitation dry_run_layer_bc.py's pseudo-taxonomy already documents
  # for Layer B/C -- coachable/sink triage will remove much of the backchannel
  # currently padding these group sizes. Re-run --grouping-compare after the
  # next full pipeline run and re-check this call, same as any other threshold
  # in this file.
  grouping_method: nested

  # See grouping_method above for the full comparison table and rationale.
  # 0.75 chosen for both methods: below it, real business topics fuse into one
  # indiscriminate blob; above it, families that belong together (backchannel,
  # affirmation) fragment into isolated pairs. For 'nested' this is the LOOSE
  # threshold paired with merge_cosine_threshold (0.85) as the tight threshold.
  primary_topic_merge_threshold: 0.75

layer_b:
  # Keep every scenario scoring at least this fraction of the best match for a
  # given trigger. Replaces the absolute 0.30 cosine threshold, which did not
  # scale: at 149 candidate scenarios, 70 percent of pairs cleared it against
  # nearly all scenarios at once.
  #
  # Measured on the full 416-transcript corpus (report_bc.log): best-match cosine
  # is a narrow band -- p10=0.496 p50=0.550 p90=0.613 -- so a low margin clears
  # nearly every scenario. Sweep over the 3994 pairs whose best match is a real
  # scenario (611 short-circuit to a sink and never reach the margin):
  #   margin  mean matches  1 match  at cap
  #   0.85        2.68         6%      73%   <- old value, "matches everything"
  #   0.90        2.46        15%      61%
  #   0.95        1.92        39%      32%
  # 0.95 is the only point where most pairs get 1-2 matches rather than 3.
  # 0.95 * p50 = 0.522, which sits near p25 of the observed band.
  relative_margin: 0.95

  # Hard ceiling on how many scenarios one pair may be assigned to.
  max_scenarios_per_pair: 3

  # Which assign_scenarios implementation runs in production. 'flat' (today's
  # single-stage search over every subtopic) is the only calibrated option.
  #
  # UNCALIBRATED as of 2026-07-30 -- see
  # docs/superpowers/specs/2026-07-30-layer-b-two-stage-matching-design.md.
  # 'strict' / 'soft' / 'fallback' are built and unit-tested against synthetic
  # vectors (tests/test_two_stage_matching.py) but have never been measured
  # against real primary_topics data, because primary_topics is still empty --
  # no production pipeline run has populated it yet. Do not switch this away
  # from 'flat' until dry_run_layer_bc.py's --matching-compare tool (not yet
  # built) has measured the recall-loss rate on real data.
  matching_strategy: flat

  # Stage-1 cutoff: keep a trigger's primary_topic(s) within this fraction of
  # its own best primary_topic match, mirroring relative_margin's shape one
  # level up the hierarchy.
  #
  # UNCALIBRATED placeholder. Set equal to relative_margin as a starting
  # guess -- both operate on the same kind of narrow, low-margin cosine band
  # this corpus already exhibits (see relative_margin's own measurement
  # above), so there is no reason to guess a different number until real
  # primary_topic vectors exist to sweep against.
  primary_topic_relative_margin: 0.95

  # Hard ceiling on how many primary_topics one pair's stage-1 may keep.
  #
  # UNCALIBRATED placeholder, mirroring max_scenarios_per_pair's shape.
  max_primary_topics_per_pair: 2

  # Fallback-strategy only: if two-stage's chosen top-1 subtopic's RAW cosine
  # similarity to the trigger falls below this floor, discard the two-stage
  # result for that pair and use flat matching instead.
  #
  # UNCALIBRATED placeholder. Set near the p25 mark of the flat best-match
  # band already measured for relative_margin above (p10=0.496, p50=0.550) --
  # a principled starting guess, not a measured value: a two-stage pick this
  # weak is more likely a stage-1 misroute than a genuine match.
  two_stage_fallback_floor: 0.50

  # Layer B sink-rescue (see docs/superpowers/specs/2026-08-04-layer-b-sink-rescue-design.md).
  # Selects which not-yet-wired assign_scenarios_with_sink_rescue strategy a future
  # pipeline wiring decision would use. 'none' means nothing here is live -- mirrors
  # how matching_strategy started at 'flat' before two-stage existed. No pipeline
  # code reads this yet; compare_sink_rescue.py loops over all three strategies
  # directly rather than reading this key.
  sink_rescue_strategy: none

  # Stage cutoff for the response-side rescue check: keep a response's own
  # best-matching non-sink scenario(s) within this fraction of ITS best match,
  # mirroring relative_margin's shape for the response signal instead of the
  # trigger signal.
  #
  # UNCALIBRATED placeholder, mirroring primary_topic_relative_margin's own
  # placeholder rationale: set equal to relative_margin as a starting guess until
  # compare_sink_rescue.py measures the real response-vs-scenario similarity band
  # -- a different, so-far-unmeasured comparison, since response and scenario
  # descriptions are both embedded via embed_document (a document-vs-document
  # band), not the query-vs-document band relative_margin was calibrated against.
  sink_rescue_relative_margin: 0.95

  # Absolute floor: a response-side rescue match must clear this raw cosine
  # similarity, not just the relative margin above. Necessary because a purely
  # relative check could rescue a pair whose response is only relatively-better-
  # matched than the sink, without being an absolutely good match to anything real.
  #
  # UNCALIBRATED placeholder. Set near two_stage_fallback_floor's own starting
  # value (0.50) for the same reason that one was: a principled starting guess
  # near the p25 mark of the already-measured trigger-vs-scenario band, not a
  # measured value for THIS (response-vs-scenario) band -- compare_sink_rescue.py
  # must print that band's real percentiles before this number is trusted.
  sink_rescue_min_similarity: 0.50

  # blended strategy only: weight on the trigger vector when blending
  # trigger+response into one matching vector (1 - this = response's weight).
  #
  # UNCALIBRATED placeholder. 0.6 weights the trigger higher since the rest of
  # this file's thresholds (relative_margin, etc.) are calibrated against
  # trigger-only similarity -- a starting guess that keeps the blend closer to
  # today's known-good behavior by default, not a measured value.
  sink_rescue_blend_alpha: 0.6

layer_c:
  # Keep only response clauses above this percentile of relevance to their own
  # scenario vector. Removes generic cross-topic moves such as "Expressing
  # Gratitude" before milestone clustering runs.
  #
  # Measured on the full corpus (report_bc_m095.log), 154 coachable scenarios
  # with responses. "zero" = scenarios left with NO milestone (over-filtering,
  # the primary Layer C risk); "capped" = scenarios over milestone_hard_cap:
  #   pct  frac 0.05 / 0.10 / 0.15 / 0.25  ->  zero      capped
  #    40      74  /  74   /  75   /  87              0
  #    60      83  /  83   /  86   /  96              0
  #    75      80  /  80   /  89   /  99              0
  # 40 is the minimum-zero percentile; 60 cost 9 extra all-zero scenarios for
  # no gain. capped is 0 at every point, so the hard cap never binds.
  milestone_relevance_percentile: 40

  # A milestone must appear in at least this fraction of the calls belonging to
  # its own scenario. Self-scaling: a 200-call scenario must clear a
  # proportionally higher bar than a 6-call one, so a large scenario cannot
  # accumulate milestones merely by being large.
  #
  # 0.05 and 0.10 both yield 74 zeros at percentile 40 -- identical coverage.
  # 0.10 is chosen because the floor of 3 dominates until 30 calls, whereas
  # 0.05 would not bite until 60, making the fraction effectively inert and
  # losing the self-scaling property for large scenarios at no benefit.
  min_milestone_call_fraction: 0.10

  # Absolute floor for small scenarios, applied as
  #   max(floor, ceil(fraction * scenario_call_count))
  #
  # MEASURED 2026-07-28 against the real production taxonomy (85 coachable
  # scenarios, not simulated): floor=3->2 was re-derived by re-running the
  # actual segment/embed/relevance-filter/HDBSCAN path for all 85 scenarios,
  # stopping short of Gemma, and cross-checked against the live DB -- 0
  # mismatches between recomputed and stored milestone counts for all 51
  # scenarios already using V2 clustering, so the recomputation is trustworthy.
  #
  # At floor=2: 3 scenarios that were fully V1-fallback (client_knowledge_gap
  # style zero-cluster cases -- specifically integration_ecosystem_constraints,
  # backend_workflow_conceptualization, job_role_specification) gain 1-2
  # evidence-backed milestones each. 9 already-V2-clustered scenarios gain
  # exactly +1 milestone each (e.g. client_subjective_perception 1->2,
  # ai_capability_and_implementation_discussion 2->3) -- a clean win, no
  # tradeoff. Net effect: 87 -> 101 milestones (+16%) across the 60 scenarios
  # this floor can reach.
  #
  # Caveat: for the 3 rescued-from-fallback scenarios specifically, this is a
  # quantity-for-auditability tradeoff, not a pure gain -- their current V1
  # Gemma free-text milestone counts (3, 3, 3) are HIGHER than what V2
  # clustering produces at floor=2 (2, 2, 1). Adopted anyway because
  # evidence-backed milestones (support_calls populated) are the entire point
  # of V2 over V1.
  #
  # This floor does NOT touch the dominant fallback cause: 28 of 85 coachable
  # scenarios hit 100% HDBSCAN noise (zero clusters found) regardless of
  # clause pool size, from 10 clauses up to 680 -- a clustering-algorithm
  # question, not a call-support-gate question. See
  # docs/superpowers/specs/2026-07-28-layer-c-rubric-depth-design.md.
  min_milestone_calls_floor: 2

  # Backstop, not the mechanism -- if it binds, the run logs loudly with the
  # offending scenario key and truncates by ranking on distinct-call support.
  #
  # MEASURED 2026-07-28, after adding UMAP above: the cap went from dormant (0
  # scenarios ever hit 10 raw candidates under the old raw-HDBSCAN algorithm)
  # to binding on 3 of 85 coachable scenarios (raw candidate counts 11, 11, 12)
  # -- an anticipated side effect of UMAP rescuing real signal, not a bug.
  # Compared two fixes head-to-head over the SAME cached clustering (isolating
  # the gate/cap knobs from the clustering algorithm):
  #   - raise cap to 15: 403 -> 407 milestones, 0 scenarios capped, and the
  #     depth distribution for the other 77 scenarios is UNCHANGED -- a
  #     surgical fix that touches only the 3 scenarios actually hitting 10.
  #   - tighten min_milestone_call_fraction instead (0.10 -> 0.12/0.15/0.20):
  #     even the mildest step (0.12) drops total milestones 403 -> 365 (-9%)
  #     while rescuing only 2 of the 3 capped scenarios, because it cuts depth
  #     from ALL 80 clustered scenarios to fix a problem specific to 3. Wrong
  #     lever, same shape as the ineffective percentile/min_cluster_size levers
  #     already ruled out above. At 0.25 it starts destroying scenarios
  #     outright (n_zero 5 -> 7).
  # Raised to 15: the surgical fix, no downside measured for the other 77.
  milestone_hard_cap: 15

  # HDBSCAN minimum cluster size for milestone discovery, as a fraction of the
  # clause pool, bounded below and above. The old hardcoded value of 2 let two
  # adjacent clauses of a SINGLE response qualify as "recurring".
  #
  # Swept alongside the UMAP fix below (2026-07-28) and shown NOT to matter --
  # kept at the same values, don't re-tune them for UMAP.
  min_cluster_size_fraction: 0.02
  min_cluster_size_floor: 3
  min_cluster_size_ceiling: 25

  # UMAP dimensionality reduction before HDBSCAN, mirroring Layer A's own
  # bertopic+umap+hdbscan pipeline. MEASURED 2026-07-28
  # (dry_run_layer_c_clustering.py): raw HDBSCAN on 768-dim bge embeddings hit
  # 100% noise (zero clusters) on 28 of 85 coachable scenarios regardless of
  # clause pool size (10 to 680 clauses) -- distance concentration in raw
  # high-dimensional space. UMAP(n_components=5, metric='cosine',
  # random_state=42) -> HDBSCAN rescued 26/28 with lower mean noise (37.9% vs
  # 71.4%), confirmed by reading cluster contents for coherence, not just
  # counting. This is a ceiling, not a fixed value: for pools too small to
  # support 5 components, the caller clamps to min(this, pool_size - 2).
  # Percentile/min_cluster_size sweeps to suppress the resulting backchannel
  # leakage were tested and shown ineffective -- see the review_flag
  # mechanism below instead. Full evidence:
  # docs/superpowers/specs/2026-07-28-layer-c-rubric-depth-design.md.
  umap_n_components: 5

  # A milestone cluster's centroid is scored by cosine similarity against
  # every sink-scenario (is_coachable=false) description vector, in the same
  # embedding space. Milestones at or above this percentile of the WHOLE
  # RUN's candidate-cluster similarity distribution are flagged for a batched
  # Gemma review (PROMPT_LAYER_C_MILESTONE_TRIAGE_BATCH) -- not auto-rejected,
  # mirroring Layer A's needs_review precedent, because the similarity band
  # measured 2026-07-28 was narrow (p10=0.636 to p95=0.735) with no clean
  # separation cliff between real milestones and backchannel.
  #
  # Self-scaling by design, like every other threshold in this file: computed
  # LIVE from this run's own candidate population, never hardcoded, because
  # the similarity distribution shifts with the corpus and with
  # merge_cosine_threshold/ubiquity_ceiling upstream.
  milestone_sink_similarity_percentile: 95

embedding:
  # Cache embeddings on disk so threshold tuning does not re-embed the corpus.
  # Worth far less on a CUDA box than on CPU -- the model runs locally.
  cache_enabled: true
  cache_path: embed_cache.db
