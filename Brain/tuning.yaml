# Brain pipeline tuning parameters.
#
# Every threshold the clustering / milestone pipeline depends on lives here.
# Change values in this file only -- no code edit is needed.
#
# Loaded by shared/tuning.py. Unknown or missing keys raise an error at load
# time rather than being silently ignored, so a typo here fails loudly instead
# of quietly reverting to a default you thought you had changed.
#
# Calibrate with:
#     python dry_run_layer_a.py --sweep     # compare many thresholds at once
#     python dry_run_layer_a.py             # full report for the values below
# Neither makes a Gemma call nor writes to the database.

layer_a:
  # Minimum distinct-call support, as a FRACTION of the corpus.
  #
  # MEASURED: this lever is inert at 416 calls. Across the whole sweep grid it
  # dropped 0-3 clusters out of 226, because BERTopic's min_cluster_size is
  # already 50 clauses at this corpus size, so every surviving cluster trivially
  # spans many calls. Kept as a safety floor for small corpora -- do NOT credit
  # it with removing junk. It does not.
  min_call_support_fraction: 0.02

  # Absolute floor, for small corpora where the fraction rounds to nothing.
  # Effective requirement is max(floor, ceil(fraction * total_calls)).
  min_call_support_floor: 4

  # Coverage above which a cluster is FLAGGED for LLM review -- not rejected.
  #
  # This used to auto-classify a cluster as mechanics. That was wrong: at every
  # operating point it condemned ~50% of the taxonomy, because a core business
  # topic legitimately appears in most calls and coverage alone cannot tell it
  # apart from backchannel. Now high coverage only attaches a warning and the
  # cluster's stats to the Gemma prompt, and the LLM decides.
  #
  # MEASURED over 171 merged clusters at merge=0.85 (416 calls):
  #   p10=10%  p25=12%  p50=20%  p75=35%  p90=56%  p95=64%  p99=72%  max=74%
  # 0.60 sits between p90 and p95 and flags 15 of 171 clusters (9%) -- an audit
  # minority, which is the point. The old 0.25 sat below p75 and would have
  # flagged well over a third of the taxonomy.
  #
  # Those 15 are exactly the ambiguous band, and they prove why this must not
  # auto-reject: 11 are junk (thanks/appreciate 73%, greetings 68%, okay/fine
  # 64%, nice/good/great 64%, yeah/yes/yep 64%, dont-know 61%, look/seen 60%,
  # moving-forward 61%, weekday names 67%, month names 69%, call-scheduling 61%)
  # but 4 are real business topics (budget/spend/cost 74%, client/customer/sales
  # 72%, API/XML/SFTP integration 64%, and the Joveo entity itself 63%). Under
  # the old auto-mechanics rule, budget-and-cost would have been DELETED from the
  # taxonomy for being too common.
  #
  # Set it in the upper tail of the observed distribution. Re-read the
  # CALL-COVERAGE DISTRIBUTION block from dry_run_layer_a.py after ANY change to
  # merge_cosine_threshold -- merging unions call sets and shifts this whole
  # distribution upward.
  ubiquity_ceiling: 0.60

  # Two clusters whose centroids are at least this cosine-similar are the same
  # scenario and get merged. Replaces the old MAX_CLUSTERS=150 count cap, which
  # merged the RAREST clusters first by keyword overlap -- the opposite end of
  # the distribution from the backchannel families that actually duplicate.
  #
  # MEASURED at 0.70 / 0.75 / 0.80 / 0.85 by inspecting the actual merge groups
  # (python dry_run_layer_a.py --merge-detail 0.70,0.75,0.80,0.85):
  #   0.70 -> 26 groups   collapses nearly the whole corpus into 26 buckets
  #   0.80 -> 119 groups  STILL over-merges: one group fused campaigns + sales
  #                       team + brand + markets + vendors; another fused job
  #                       boards + career sites + resumes + job descriptions
  #   0.85 -> 162 groups  correctly unifies the duplicate families
  #                       (thanks/appreciate, okay/fine/alright, calendar +
  #                       scheduling, email + slack, city/country/region) while
  #                       leaving distinct business topics separate
  # Below ~0.85 the centroids of large clause sets converge toward a generic
  # "conversation" direction, so aggressive merging destroys real distinctions
  # before it removes duplicates. Lower = more aggressive merging.
  merge_cosine_threshold: 0.85

  # Cheap pre-filter: minimum non-stopword alphabetic tokens for a clause to
  # enter the pool. Removes bare "Perfect." / "Yeah." only -- deliberately NOT
  # the primary defence against generic text.
  min_content_words: 5

  # MEASURED 2026-07-30 (python dry_run_layer_a.py --grouping-compare, full
  # 416-call corpus, zero Gemma calls -- judged by reading actual c-TF-IDF
  # keyword groups, not by counting groups, same convention as merge_detail
  # above). 'post_hoc' merges already-adjudicated subtopic centroids after the
  # main loop finishes; 'nested' merges RAW topic centroids into macro-groups
  # FIRST, then subtopic-merges within each one (see shared/topic_grouping.py).
  #
  #   loose   post_hoc groups (top size)   nested groups (top size)
  #   0.55        2  (170)                     3  (168)
  #   0.60        6  (153)                      8  (147)
  #   0.65       13  (125)                     17  (121)
  #   0.70       29   (93)                     31   (92)
  #   0.75       56   (26)                     68   (21)
  #   0.80      101   (13)                    118    (5)
  #
  # Below ~0.70 BOTH methods collapse into one indiscriminate mega-group fusing
  # budget/spend, Joveo-brand mentions, sales-role mentions, and calendar dates
  # into a single "primary topic" -- the same centroids-converge-toward-a-
  # generic-direction failure merge_cosine_threshold's own calibration already
  # documents below 0.85, reappearing one level up the hierarchy. Above ~0.80
  # both start FRAGMENTING families that clearly belong together (okay/yeah/
  # appreciate/thanks/dont-know backchannel splits into isolated 2-member pairs
  # instead of staying one umbrella).
  #
  # 0.75 is the sweet spot for both: the residual mixed-topic blob shrinks to a
  # plausible "recruitment/product-domain terminology" umbrella (26 / 21
  # members) while scheduling, AI/automation, communication-logistics,
  # positive-sentiment and difficulty/concern all separate into coherent,
  # individually-nameable groups. nested wins over post_hoc at that threshold:
  # its residual blob is smaller (21 vs 26 members), and it recovers real
  # distinctions post_hoc's two-step process misses -- e.g. a clean 5-member
  # scheduling/timezone group, and an AI+automation group that captures
  # "programmatic advertising" (a real Joveo product term) where post_hoc's
  # version does not.
  #
  # CAVEAT: this compares c-TF-IDF keyword clusters BEFORE Gemma adjudication,
  # the same limitation dry_run_layer_bc.py's pseudo-taxonomy already documents
  # for Layer B/C -- coachable/sink triage will remove much of the backchannel
  # currently padding these group sizes. Re-run --grouping-compare after the
  # next full pipeline run and re-check this call, same as any other threshold
  # in this file.
  grouping_method: nested

  # See grouping_method above for the full comparison table and rationale.
  # 0.75 chosen for both methods: below it, real business topics fuse into one
  # indiscriminate blob; above it, families that belong together (backchannel,
  # affirmation) fragment into isolated pairs. For 'nested' this is the LOOSE
  # threshold paired with merge_cosine_threshold (0.85) as the tight threshold.
  primary_topic_merge_threshold: 0.75

  # Corpus-wide response-taxonomy dry run (see
  # docs/superpowers/specs/2026-08-07-layer-a-response-taxonomy-gap-design.md). A response
  # cluster is skipped from three-way Gemma adjudication when one existing COACHABLE
  # scenario already accounts for at least this fraction of the cluster's members --
  # client-side and response-side taxonomies already agree there, so adjudicating it
  # would spend a Gemma call answering a question nobody asked. A cluster dominated by a
  # SINK scenario at this same fraction is NOT skipped -- that is exactly the case this
  # dry run exists to examine.
  #
  # PRE-REGISTERED STARTING POINT, not a fitted value -- fixed before dry_run_response_
  # taxonomy.py's own purity distribution exists, the same discipline diagnose_sink_pool.py's
  # _NOISE_ESCAPE_HATCH/_MIX_UNINFORMATIVE_BAND were held to. The dry run's own report is
  # what validates or corrects this number.
  response_taxonomy_purity_gate: 0.90

  # Permanent auto-pass (see docs/superpowers/specs/2026-08-07-response-taxonomy-auto-pass-
  # design.md): runs after every pipeline execution, clusters the sink pool, and graduates
  # any candidate that reappears across response_taxonomy_consensus_runs consecutive runs
  # into a real scenario -- zero human step. Off by default; flip to true only for the
  # explicit, separately-gated real run.
  response_taxonomy_auto_pass_enabled: false

  # Consecutive pipeline runs a candidate must reappear in (via Jaccard overlap of its
  # member pairs, not embedding similarity -- Postgres never stores vectors in this
  # codebase) before it graduates. Absorbs the documented UMAP+HDBSCAN run-to-run
  # instability (241->403->398->404 milestones for one identical corpus) by requiring
  # cross-run agreement instead of acting on a single run's clustering.
  #
  # PRE-REGISTERED STARTING POINT, not a fitted value -- there is no real run history to
  # calibrate against yet, same discipline response_taxonomy_purity_gate was held to.
  response_taxonomy_consensus_runs: 3

  # Jaccard overlap of member_pair_ids that counts as "the same candidate reappeared"
  # across two runs.
  #
  # PRE-REGISTERED STARTING POINT, not a fitted value, same discipline as the two keys
  # above.
  response_taxonomy_candidate_match_overlap: 0.5

layer_b:
  # Keep every scenario scoring at least this fraction of the best match for a
  # given trigger. Replaces the absolute 0.30 cosine threshold, which did not
  # scale: at 149 candidate scenarios, 70 percent of pairs cleared it against
  # nearly all scenarios at once.
  #
  # Measured on the full 416-transcript corpus (report_bc.log): best-match cosine
  # is a narrow band -- p10=0.496 p50=0.550 p90=0.613 -- so a low margin clears
  # nearly every scenario. Sweep over the 3994 pairs whose best match is a real
  # scenario (611 short-circuit to a sink and never reach the margin):
  #   margin  mean matches  1 match  at cap
  #   0.85        2.68         6%      73%   <- old value, "matches everything"
  #   0.90        2.46        15%      61%
  #   0.95        1.92        39%      32%
  # 0.95 is the only point where most pairs get 1-2 matches rather than 3.
  # 0.95 * p50 = 0.522, which sits near p25 of the observed band.
  relative_margin: 0.95

  # Hard ceiling on how many scenarios one pair may be assigned to.
  max_scenarios_per_pair: 3

  # Which assign_scenarios implementation runs in production. 'flat' (today's
  # single-stage search over every subtopic) is the only calibrated option.
  #
  # UNCALIBRATED as of 2026-07-30 -- see
  # docs/superpowers/specs/2026-07-30-layer-b-two-stage-matching-design.md.
  # 'strict' / 'soft' / 'fallback' are built and unit-tested against synthetic
  # vectors (tests/test_two_stage_matching.py) but have never been measured
  # against real primary_topics data, because primary_topics is still empty --
  # no production pipeline run has populated it yet. Do not switch this away
  # from 'flat' until dry_run_layer_bc.py's --matching-compare tool (not yet
  # built) has measured the recall-loss rate on real data.
  matching_strategy: flat

  # Stage-1 cutoff: keep a trigger's primary_topic(s) within this fraction of
  # its own best primary_topic match, mirroring relative_margin's shape one
  # level up the hierarchy.
  #
  # UNCALIBRATED placeholder. Set equal to relative_margin as a starting
  # guess -- both operate on the same kind of narrow, low-margin cosine band
  # this corpus already exhibits (see relative_margin's own measurement
  # above), so there is no reason to guess a different number until real
  # primary_topic vectors exist to sweep against.
  primary_topic_relative_margin: 0.95

  # Hard ceiling on how many primary_topics one pair's stage-1 may keep.
  #
  # UNCALIBRATED placeholder, mirroring max_scenarios_per_pair's shape.
  max_primary_topics_per_pair: 2

  # Fallback-strategy only: if two-stage's chosen top-1 subtopic's RAW cosine
  # similarity to the trigger falls below this floor, discard the two-stage
  # result for that pair and use flat matching instead.
  #
  # UNCALIBRATED placeholder. Set near the p25 mark of the flat best-match
  # band already measured for relative_margin above (p10=0.496, p50=0.550) --
  # a principled starting guess, not a measured value: a two-stage pick this
  # weak is more likely a stage-1 misroute than a genuine match.
  two_stage_fallback_floor: 0.50

  # Layer B sink-rescue (see docs/superpowers/specs/2026-08-04-layer-b-sink-rescue-design.md).
  # Selects which not-yet-wired assign_scenarios_with_sink_rescue strategy a future
  # pipeline wiring decision would use. 'none' means nothing here is live -- mirrors
  # how matching_strategy started at 'flat' before two-stage existed. No pipeline
  # code reads this yet; compare_sink_rescue.py loops over all three strategies
  # directly rather than reading this key.
  sink_rescue_strategy: none

  # Stage cutoff for the response-side rescue check: keep a response's own
  # best-matching non-sink scenario(s) within this fraction of ITS best match,
  # mirroring relative_margin's shape for the response signal instead of the
  # trigger signal.
  #
  # UNCALIBRATED placeholder, mirroring primary_topic_relative_margin's own
  # placeholder rationale: set equal to relative_margin as a starting guess until
  # compare_sink_rescue.py measures the real response-vs-scenario similarity band
  # -- a different, so-far-unmeasured comparison, since response and scenario
  # descriptions are both embedded via embed_document (a document-vs-document
  # band), not the query-vs-document band relative_margin was calibrated against.
  sink_rescue_relative_margin: 0.95

  # Absolute floor: a response-side rescue match must clear this raw cosine
  # similarity, not just the relative margin above. Necessary because a purely
  # relative check could rescue a pair whose response is only relatively-better-
  # matched than the sink, without being an absolutely good match to anything real.
  #
  # This is the RESPONSE-vs-scenario (document-vs-document) band -- both the
  # response text and scenario descriptions are embedded via embed_document, so
  # this is NOT the same band relative_margin/two_stage_fallback_floor were
  # calibrated against (that's the query-vs-document trigger band, see
  # sink_rescue_trigger_weak_floor below). Measured 2026-08-04 via
  # compare_sink_rescue.py against the real `public` schema: p10=0.552,
  # p25=0.598, p50=0.635, p75=0.664, p90=0.688 -- every percentile clears this
  # 0.50 placeholder, so today it filters nothing at all.
  #
  # Recalibration round 2 (2026-08-04): moved to the measured p50 (0.635) as
  # the first real data point off the 0.50 placeholder -- see the "or_rule
  # recalibration" status update below for what this produced.
  sink_rescue_response_min_similarity: 0.635

  # Absolute floor deciding whether the TRIGGER's own top1 match is "weak"
  # enough for or_rule to let the response attempt an override. This is the
  # TRIGGER-vs-scenario (query-vs-document) band -- the SAME band
  # relative_margin was calibrated against (p10=0.496, p50=0.550, p90=0.613),
  # NOT the response band above. Do not tune this off the response
  # percentiles printed by compare_sink_rescue.py; it is a different
  # comparison entirely.
  #
  # DIRECTION, corrected 2026-08-04 (the first round's CLAUDE.md writeup had
  # this backwards): the comparison is `t_sims[best] < floor` -- RAISING this
  # value makes MORE pairs count as "weak" and reach the response check, it
  # does not shrink the population. At 0.50, 1616/1865 (87%) of sink-bound
  # pairs never reached the check at all because their trigger's own match to
  # the sink was already >= 0.50 (sink/backchannel clusters are lexically
  # tight, so a confident sink match is common, not rare). Round 2: raised to
  # 0.65, comfortably above the trigger band's own p90 (0.613), specifically
  # to pull in most of those confidently-sink-matched pairs too -- since that
  # confident-sink-trigger-but-substantive-response case is this whole
  # design's original motivating failure shape, which round 1 (floor=0.50)
  # structurally could not reach.
  sink_rescue_trigger_weak_floor: 0.65

  # blended strategy only: weight on the trigger vector when blending
  # trigger+response into one matching vector (1 - this = response's weight).
  #
  # UNCALIBRATED placeholder. 0.6 weights the trigger higher since the rest of
  # this file's thresholds (relative_margin, etc.) are calibrated against
  # trigger-only similarity -- a starting guess that keeps the blend closer to
  # today's known-good behavior by default, not a measured value.
  sink_rescue_blend_alpha: 0.6

  # content_gate_narrow / content_gate_broad (pivot, Status update 3 in the
  # sink-rescue design). Primary gate: concrete_content_density(response) >=
  # this means the response clearly carries content, rescue regardless of
  # preceding_turn_is_question.
  #
  # UNCALIBRATED placeholder -- must come from label_trigger_quality_sample.py's
  # labeled-sample read (concrete_content_density(response) split by
  # ground-truth coachable/not label), never guessed, per this file's own
  # repeated rule. Do not treat this value as trusted until that script has run.
  sink_rescue_density_threshold: 0.5

  # Below this, the response clearly does NOT carry content -- no rescue,
  # regardless of preceding_turn_is_question. Between this and
  # sink_rescue_density_threshold is the borderline band where
  # preceding_turn_is_question breaks the tie.
  #
  # UNCALIBRATED placeholder -- same rule and same source as
  # sink_rescue_density_threshold above.
  sink_rescue_density_borderline_floor: 0.2

  # Minimum response content_word_count before the density gate is trusted at
  # all. concrete_content_density is a ratio, and for a response only a
  # handful of words long, one incidental named entity or noun chunk swings
  # that ratio hard enough to be noise, not signal -- below this floor, the
  # gate defaults to no-rescue rather than trusting it.
  #
  # UNCALIBRATED placeholder -- must come from label_trigger_quality_sample.py's
  # own response-length distribution, never guessed.
  sink_rescue_density_min_words: 3

layer_c:
  # Keep only response clauses above this percentile of relevance to their own
  # scenario vector. Removes generic cross-topic moves such as "Expressing
  # Gratitude" before milestone clustering runs.
  #
  # Measured on the full corpus (report_bc_m095.log), 154 coachable scenarios
  # with responses. "zero" = scenarios left with NO milestone (over-filtering,
  # the primary Layer C risk); "capped" = scenarios over milestone_hard_cap:
  #   pct  frac 0.05 / 0.10 / 0.15 / 0.25  ->  zero      capped
  #    40      74  /  74   /  75   /  87              0
  #    60      83  /  83   /  86   /  96              0
  #    75      80  /  80   /  89   /  99              0
  # 40 is the minimum-zero percentile; 60 cost 9 extra all-zero scenarios for
  # no gain. capped is 0 at every point, so the hard cap never binds.
  milestone_relevance_percentile: 40

  # A milestone must appear in at least this fraction of the calls belonging to
  # its own scenario. Self-scaling: a 200-call scenario must clear a
  # proportionally higher bar than a 6-call one, so a large scenario cannot
  # accumulate milestones merely by being large.
  #
  # 0.05 and 0.10 both yield 74 zeros at percentile 40 -- identical coverage.
  # 0.10 is chosen because the floor of 3 dominates until 30 calls, whereas
  # 0.05 would not bite until 60, making the fraction effectively inert and
  # losing the self-scaling property for large scenarios at no benefit.
  min_milestone_call_fraction: 0.10

  # Absolute floor for small scenarios, applied as
  #   max(floor, ceil(fraction * scenario_call_count))
  #
  # MEASURED 2026-07-28 against the real production taxonomy (85 coachable
  # scenarios, not simulated): floor=3->2 was re-derived by re-running the
  # actual segment/embed/relevance-filter/HDBSCAN path for all 85 scenarios,
  # stopping short of Gemma, and cross-checked against the live DB -- 0
  # mismatches between recomputed and stored milestone counts for all 51
  # scenarios already using V2 clustering, so the recomputation is trustworthy.
  #
  # At floor=2: 3 scenarios that were fully V1-fallback (client_knowledge_gap
  # style zero-cluster cases -- specifically integration_ecosystem_constraints,
  # backend_workflow_conceptualization, job_role_specification) gain 1-2
  # evidence-backed milestones each. 9 already-V2-clustered scenarios gain
  # exactly +1 milestone each (e.g. client_subjective_perception 1->2,
  # ai_capability_and_implementation_discussion 2->3) -- a clean win, no
  # tradeoff. Net effect: 87 -> 101 milestones (+16%) across the 60 scenarios
  # this floor can reach.
  #
  # Caveat: for the 3 rescued-from-fallback scenarios specifically, this is a
  # quantity-for-auditability tradeoff, not a pure gain -- their current V1
  # Gemma free-text milestone counts (3, 3, 3) are HIGHER than what V2
  # clustering produces at floor=2 (2, 2, 1). Adopted anyway because
  # evidence-backed milestones (support_calls populated) are the entire point
  # of V2 over V1.
  #
  # This floor does NOT touch the dominant fallback cause: 28 of 85 coachable
  # scenarios hit 100% HDBSCAN noise (zero clusters found) regardless of
  # clause pool size, from 10 clauses up to 680 -- a clustering-algorithm
  # question, not a call-support-gate question. See
  # docs/superpowers/specs/2026-07-28-layer-c-rubric-depth-design.md.
  min_milestone_calls_floor: 2

  # Backstop, not the mechanism -- if it binds, the run logs loudly with the
  # offending scenario key and truncates by ranking on distinct-call support.
  #
  # MEASURED 2026-07-28, after adding UMAP above: the cap went from dormant (0
  # scenarios ever hit 10 raw candidates under the old raw-HDBSCAN algorithm)
  # to binding on 3 of 85 coachable scenarios (raw candidate counts 11, 11, 12)
  # -- an anticipated side effect of UMAP rescuing real signal, not a bug.
  # Compared two fixes head-to-head over the SAME cached clustering (isolating
  # the gate/cap knobs from the clustering algorithm):
  #   - raise cap to 15: 403 -> 407 milestones, 0 scenarios capped, and the
  #     depth distribution for the other 77 scenarios is UNCHANGED -- a
  #     surgical fix that touches only the 3 scenarios actually hitting 10.
  #   - tighten min_milestone_call_fraction instead (0.10 -> 0.12/0.15/0.20):
  #     even the mildest step (0.12) drops total milestones 403 -> 365 (-9%)
  #     while rescuing only 2 of the 3 capped scenarios, because it cuts depth
  #     from ALL 80 clustered scenarios to fix a problem specific to 3. Wrong
  #     lever, same shape as the ineffective percentile/min_cluster_size levers
  #     already ruled out above. At 0.25 it starts destroying scenarios
  #     outright (n_zero 5 -> 7).
  # Raised to 15: the surgical fix, no downside measured for the other 77.
  milestone_hard_cap: 15

  # HDBSCAN minimum cluster size for milestone discovery, as a fraction of the
  # clause pool, bounded below and above. The old hardcoded value of 2 let two
  # adjacent clauses of a SINGLE response qualify as "recurring".
  #
  # Swept alongside the UMAP fix below (2026-07-28) and shown NOT to matter --
  # kept at the same values, don't re-tune them for UMAP.
  min_cluster_size_fraction: 0.02
  min_cluster_size_floor: 3
  min_cluster_size_ceiling: 25

  # UMAP dimensionality reduction before HDBSCAN, mirroring Layer A's own
  # bertopic+umap+hdbscan pipeline. MEASURED 2026-07-28
  # (dry_run_layer_c_clustering.py): raw HDBSCAN on 768-dim bge embeddings hit
  # 100% noise (zero clusters) on 28 of 85 coachable scenarios regardless of
  # clause pool size (10 to 680 clauses) -- distance concentration in raw
  # high-dimensional space. UMAP(n_components=5, metric='cosine',
  # random_state=42) -> HDBSCAN rescued 26/28 with lower mean noise (37.9% vs
  # 71.4%), confirmed by reading cluster contents for coherence, not just
  # counting. This is a ceiling, not a fixed value: for pools too small to
  # support 5 components, the caller clamps to min(this, pool_size - 2).
  # Percentile/min_cluster_size sweeps to suppress the resulting backchannel
  # leakage were tested and shown ineffective -- see the review_flag
  # mechanism below instead. Full evidence:
  # docs/superpowers/specs/2026-07-28-layer-c-rubric-depth-design.md.
  umap_n_components: 5

  # A milestone cluster's centroid is scored by cosine similarity against
  # every sink-scenario (is_coachable=false) description vector, in the same
  # embedding space. Milestones at or above this percentile of the WHOLE
  # RUN's candidate-cluster similarity distribution are flagged for a batched
  # Gemma review (PROMPT_LAYER_C_MILESTONE_TRIAGE_BATCH) -- not auto-rejected,
  # mirroring Layer A's needs_review precedent, because the similarity band
  # measured 2026-07-28 was narrow (p10=0.636 to p95=0.735) with no clean
  # separation cliff between real milestones and backchannel.
  #
  # Self-scaling by design, like every other threshold in this file: computed
  # LIVE from this run's own candidate population, never hardcoded, because
  # the similarity distribution shifts with the corpus and with
  # merge_cosine_threshold/ubiquity_ceiling upstream.
  milestone_sink_similarity_percentile: 95

  # Which describe prompt writes each milestone's criterion. Strategy selector, same
  # shape as layer_b.matching_strategy and layer_d.signal_detection_mode -- NOT a
  # threshold.
  #
  #   legacy   -- PROMPT_LAYER_C_MILESTONE_DESCRIBE_BATCH. Batches 5 milestones drawn
  #               across ALL scenarios; each one sees only its own response clauses and
  #               the scenario's key string, and is told to write independently and to
  #               strip out specifics.
  #   situated -- PROMPT_LAYER_C_MILESTONE_DESCRIBE_SITUATED. One call per scenario, so a
  #               move is shown its SIBLINGS; adds the CLIENT TURNS that prompted each
  #               cluster, the scenario's description and keyphrases, and its nearest
  #               other scenarios; requires a precondition; and permits naming the
  #               subject matter.
  #
  # WHY THIS EXISTS. Measured 2026-08-11/12 across three independent runs: the expert
  # scores 0.114-0.116 against his own rubrics and 0.090-0.095 against deliberately
  # UNRELATED ones. At 1.2:1 the criteria do not identify a situation, so no per-scenario
  # number computed from them means anything. The cause is that the legacy prompt is
  # BLIND -- it has never seen a client turn, which is also why no milestone can state a
  # precondition (234 of 235 are labelled "fixed"; the conditional trigger fires 0 of
  # 226). That is a missing-input problem, so a fourth wording pass cannot fix it.
  #
  # Cost is unchanged: 405/5 = 81 calls under legacy, ~82 under situated.
  #
  # DEFAULT 'legacy' until the four-arm trial clears its gate --
  # docs/superpowers/specs/2026-08-12-layer-c-profile-rebuild-design.md. The gate is
  # inherited, not invented: W(unrelated) < 0.5 x W(matched), i.e. the null must roughly
  # halve. JUDGE THIS KNOB BY READING THE CRITERIA IT WRITES, never by the hit rate --
  # showing siblings invites the model to INVENT distinctions to look different, which
  # would raise discrimination while making the criteria less true.
  describe_mode: legacy

# ---------------------------------------------------------------------------
# Layer D -- Ego Trap gap analysis (Brain/ego_trap/)
# ---------------------------------------------------------------------------
# These knobs used to live in ego_trap/settings.py as bare os.environ reads, which
# made Layer D the only part of Brain where a .env line could silently override a
# value the reader believed they had set in code. That is exactly the failure this
# file's raise-on-unknown-key rule exists to prevent, and it had already produced a
# live divergence (settings.py default 0.75 vs .env's actual 0.35). settings.py is
# deleted; ops/run_ego_trap.py refuses to start if a retired var is still in .env.
layer_d:
  # Which Step 0 signal detector runs. Strategy selector, same shape as
  # layer_b.matching_strategy -- not a threshold.
  #   gemma      -- one Gemma call per transcript sees the whole transcript plus the
  #                 coachable-scenario menu (PROMPT_STEP0_SIGNAL_CHECK).
  #   similarity -- embeds every CLIENT turn and matches against scenario vectors
  #                 locally, zero Gemma calls.
  #
  # This value is also the checkpoint layer suffix
  # (ego_trap/pipeline.py: layer = f"ego_trap_{mode}_v2"), so the strings are
  # load-bearing: changing one invalidates prior checkpoints and reprocesses every
  # transcript. That matters because gap_events has no uniqueness constraint and
  # upsert_milestone_performance does attempts = attempts + 1 on conflict, so a
  # reprocess without ops/clear_ego_trap_data.py duplicates rows AND double-counts.
  #
  # MEASURED 2026-07-07 (ego_trap/GEMMA_MODE_ANALYSIS.md, same 3 transcripts, no
  # code change between runs): similarity @ the old absolute 0.35 floor produced 61
  # "signals", gemma produced 13. All 13 were read by hand and are substantive
  # business statements; similarity's 61 included the client saying "I'm good. Thank
  # you." matched to managed_service_vs_direct_access. The 61 -> 13 drop is the
  # improvement, not a regression. JUDGE THIS KNOB BY READING THE SIGNALS IT KEEPS,
  # NEVER BY COUNTING THEM -- a higher count is the known failure mode here.
  #
  # SET TO 'similarity' 2026-08-10 for the 106-call Madhumita run. Rationale: gemma mode
  # needs one Step 0 call per transcript on top of the scoring calls, and the first
  # attempt at 106 transcripts spent both API keys' quota on rate-limit backoff after
  # only 2 transcripts. similarity mode makes Step 0 free (local embed cache, zero
  # network), leaving Gemma spend to Step 3 scoring alone. Note the 2026-07-07 caveat
  # above still stands -- similarity mode's precision was the reason gemma was adopted,
  # so read the signals, and treat this as a throughput decision rather than a quality
  # one. What is different now: the old absolute 0.35 floor is gone, and the sink
  # comparison rejects 57.3% of client turns (measured over all 6,482), which is the
  # specific defect that made similarity mode unusable before.
  signal_detection_mode: similarity

  # similarity mode only; ignored in gemma mode.
  #
  # Replaces the old absolute cosine floor (EGO_TRAP_SIMILARITY_THRESHOLD, live at
  # 0.35). An absolute floor is the rule layer_b DELETED for not scaling, and the
  # 2026-08-10 dry run against the real 3-transcript / 201-client-turn CSM corpus
  # settled how badly it was miscalibrated: best-match cosine is p10=0.501 p25=0.540
  # p50=0.581 p75=0.615 p90=0.648, so 0.35 sat BELOW THE ENTIRE DISTRIBUTION and
  # admitted 100.0% of client turns -- every "Thank you." and "Can you see my
  # screen?" included. (That band also confirms Layer D and layer_b share one
  # embedding band: layer_b measured p10=0.496 p50=0.550 p90=0.613 over 416
  # transcripts.)
  #
  # *** INERT AT max_scenarios_per_signal: 1 -- DO NOT TRY TO TUNE IT THERE. ***
  # Measured, then proven from the code: the dry run's margin sweep returned exactly
  # 79 signals at every value from 0.85 to 0.99, because relative_match.topk_pick
  # takes candidates[:cap] and `sims[best] >= margin * sims[best]` holds for every
  # margin <= 1. The margin governs only how many ADDITIONAL near-ties survive
  # alongside the best match, and at cap 1 there are no additional slots. Same class
  # of finding as layer_a.min_call_support_fraction being inert at this corpus size:
  # recorded so nobody "tunes" it and believes they changed something.
  #
  # So in similarity mode the accept/reject decision is made ENTIRELY by the sink
  # comparison -- a turn is a signal iff its best match is a coachable scenario
  # rather than a mechanics/logistics sink. Measured rejection rate: 122/201 turns
  # (60.7%), of which 108 lost to mechanics and 14 to logistics; reading the
  # highest-scoring rejected turns confirms them ("Thank you.", "Yeah. That makes
  # sense.", "Good."). This value becomes live only if max_scenarios_per_signal is
  # raised above 1, at which point it needs the sweep and the sample reading.
  similarity_relative_margin: 0.95

  # Max scenarios one detected signal can carry. 1 because a gap record scores one
  # CSM response against one rubric; the harness reports the wider candidate list
  # for observability without acting on it. NOTE: this is what makes
  # similarity_relative_margin inert -- see the block above before raising it.
  max_scenarios_per_signal: 1

  # gemma mode: shortlist the N scenarios most similar to this transcript's client
  # turns before building the prompt, instead of listing every coachable one.
  # 0 disables the shortlist entirely (list all coachable scenarios).
  #
  # Ships at 0 ON PURPOSE. Filtering sinks already roughly halves the menu (157 ->
  # ~81) and that half is validated -- a sink in the prompt is provably an invitation
  # to misclassify backchannel. Any K > 0 additionally trades RECALL for precision,
  # and that trade is measurable: dry_run_ego_trap.py --shortlist-sweep reports, per
  # K, what fraction of the scenario keys Gemma actually returned would have survived
  # the shortlist. Do not raise this without reading that table.
  gemma_scenario_shortlist_k: 0

  # How Gemma's quoted client_utterance is matched back to a transcript turn, to
  # recover its turn index. A quote that cannot be located drops the signal entirely.
  #   exact      -- verbatim equality then verbatim containment (the original rule)
  #   normalized -- the same two passes, case/punctuation/whitespace-insensitive
  #   ratio      -- difflib.SequenceMatcher argmax above turn_match_min_ratio
  #
  # 'normalized' is the default because it introduces NO new number: it only stops
  # a smart quote or a trailing period from discarding a real signal. 'ratio' is
  # implemented but off -- see the next key.
  turn_match_mode: normalized

  # UNCALIBRATED, and read ONLY when turn_match_mode is 'ratio'.
  #
  # Unlike the other two modes this one invents a number, so it must not be switched
  # on from a guess. The evidence needed to choose it does not exist yet: the two
  # dropped signals recorded in GEMMA_MODE_ANALYSIS.md were logged through a print
  # truncated at exactly 80 characters, so we cannot even tell whether Gemma
  # paraphrased, truncated, spanned two turns, or quoted a non-CLIENT speaker.
  # dry_run_ego_trap.py A/Bs every mode through the real resolver and prints each
  # newly-matched pair side by side; decide from those, not from the totals.
  turn_match_min_ratio: 0.85

  # Write the per-signal gap JSON to gap_events. The aggregate tables
  # (milestone_performance, signal_recognition_gaps) are written either way, so this
  # gates only the traceability record. Feature flag, same shape as
  # layer_a.response_taxonomy_auto_pass_enabled.
  #
  # Keep this true. Every Layer D finding to date came from reading gap_events.gaps
  # -- including the 2026-07-06 result that the zero hit rate was NOT rubric-wording
  # bias but false-positive Step 0 signals. With it false, a run is unauditable.
  gap_events_enabled: true

  # Skip milestones that ops/flag_uncoachable_milestones.py marked not_coachable_flag.
  #
  # MEASURED 2026-08-10 on the 19-transcript subset: 17 of 405 milestones (4%) are
  # unsatisfiable by a CSM by construction -- 5 require seniority or personal relationships
  # ("leverage professional relationships", support 15 calls), 4 have no observable criterion
  # ("share a vulnerable personal story"), and 8 are call mechanics that leaked past Layer C's
  # milestone_sink_similarity_percentile triage ("offer screen-sharing", "manage speaking
  # turns"). Those 17 took **74 attempts and produced 0 hits** -- zero across 12 distinct
  # milestones, which is what confirms they are impossible rather than merely hard.
  #
  # The metric effect is small (full-hit 3.0% -> 3.3%, weighted 0.068 -> 0.073). THE REAL
  # REASON is not the metric: every one of those 74 misses also emitted a Milestone_Omission
  # gap with a gap_to_ideal, i.e. 74 pieces of coaching advice instructing a CSM to do
  # something they cannot do. That is actively harmful output, not just noise.
  #
  # Honest-reporting rule: excluding milestones shrinks the denominator, which raises the
  # rate arithmetically. Always quote both the all-milestone and coachable-only figures, and
  # never present the difference as the CSM having improved.
  #
  # Flags are advisory and reversible -- the pass only sets a JSON key, and re-running it
  # clears stale flags. To overrule one, clear not_coachable_flag on that milestone.
  skip_uncoachable_milestones: true

  # Score only milestones carrying a FRESH `validated` or `contingent` verdict from
  # calibration/validate_rubrics.py. Mirrors skip_uncoachable_milestones above, which
  # already skips the 17 hand-flagged ones -- but that flag is a hand-audited judgement
  # about specific milestones, and this is a measurement, so they stay separate keys. A
  # reader must be able to tell which one silenced a milestone.
  #
  # WHY IT EXISTS. The 2026-08-11 ceiling run graded Naren against his own rubrics with
  # both circularities closed and found the instrument does not discriminate: W(A3) 0.114
  # against an UNRELATED-rubric control at W(B) 0.090 on the same model -- 1.27 : 1. Per
  # scenario it is bimodal, not uniformly broken: 16 of 40 discriminate clearly, 7 have a
  # control score of exactly 0.000, and 7 INVERT (the wrong rubric scores higher). The two
  # halves cancel in every global average, which is why four consecutive fixes each moved
  # the hit rate slightly and none broke 4%. This key is what lets Layer D stop scoring
  # against the half that measures nothing.
  #
  # `contingent` is NOT skipped. It means the move is real but conditional, and Layer D
  # scores it only where the applicability check passes -- the fix for the dominant
  # proximate cause (contingent moves emitted as mandatory; 234 of 235 milestones are
  # labelled "fixed" and the conditional trigger fires 0 of 226 times).
  #
  # DEFAULT false, exactly like layer_a.response_taxonomy_auto_pass_enabled shipped off.
  # Turning it on against a rubric set that was never validated empties every rubric,
  # because a milestone with no verdict is not scored. Run validate_rubrics.py and READ
  # its report before flipping this.
  #
  # A verdict goes stale on its own: it is fingerprinted against the milestone's own
  # description + detection_hint, and upsert_rubric's ON CONFLICT (scenario_id) replaces
  # `milestones` in place, so any Layer C run silently invalidates every verdict. Stale
  # verdicts are refused, never used -- so re-validation is mandatory after Layer C, and
  # that ongoing cost is an argument for running Layer C rarely, not for skipping it.
  require_validated_milestones: false

  # Score the soft_skill_rubric alongside the milestones.
  #
  # ON, and it should stay on. The toggle exists only so a request-budget emergency has a
  # lever, not as a default -- turning it off silently drops half of what Layer D
  # measures, and all 84 coachable rubrics do carry a soft_skill_rubric.
  #
  # Cost, measured 2026-08-10: it adds one Gemma call per batch, but that call is cheap --
  # 5,228 input + 1,320 output tokens at batch 12, versus 18,803 + 8,750 for the milestone
  # call. So it is +24% tokens and +100% REQUESTS, and requests are the binding constraint
  # (flash-lite allows 500/day). At batch 12 with the de-duplicated milestone prompt:
  #   20-transcript subset : ~80 calls  (16% of 500 RPD)
  #   all 106 transcripts  : ~424 calls (85% of 500 RPD -- tight, use both keys)
  #
  # The soft-skill prompt has the same repeat-per-item shape the milestone prompt was
  # fixed for, but de-duplicating it would save little: excellent+failing execution text
  # averages 398 chars against the benchmark response's 2,388, and there are only ~1.9
  # skills per scenario. Not worth the change.
  score_soft_skills: true

  # Severity buckets for a CSM's ACCUMULATED miss rate on one milestone, derived at
  # query time from milestone_performance as
  #     miss_rate = (attempts - hits - 0.5 * partial_hits) / attempts
  # i.e. exactly 1 - the weighted score db/schema.sql documents, so severity and the
  # reported score can never disagree.
  #
  # Never stored on a row, and never attached to a single gap_event: one event's
  # miss_rate is only ever 0.0 / 0.5 / 1.0, so per-event severity is always 'low' or
  # 'critical' and carries no information. Same reason the weighted score is not
  # stored -- it changes every time attempts increments.
  #
  # Fractions of a CSM's own attempts, so they self-scale as calls accumulate.
  # ORIGINAL SPEC VALUES (Ego_trap.md section 5), NOT FITTED: Layer D has never
  # recorded a milestone hit in any run (0/8, 0/61, 0/8), so every observed miss_rate
  # is 1.0 and lands in 'critical' wherever these sit. Do NOT re-tune them off that
  # -- the blocker is Step 0 false positives and missing rubrics, not these
  # boundaries. Re-derive once a run yields a spread of hit rates at attempts >= 3.
  gap_severity_critical_miss_rate: 0.60
  gap_severity_high_miss_rate: 0.35
  gap_severity_moderate_miss_rate: 0.15

embedding:
  # Cache embeddings on disk so threshold tuning does not re-embed the corpus.
  # Worth far less on a CUDA box than on CPU -- the model runs locally.
  #
  # WORTH FAR MORE ON THE gemini BACKEND: there the cache is the difference between
  # a free re-run and spending daily request quota again. The cache key includes the
  # model AND the dimension, so backends and truncation levels coexist in one file
  # and switching back to local never re-embeds anything.
  cache_enabled: true
  cache_path: embed_cache.db

  # local  -> BAAI/bge-base-en-v1.5 on this machine. Free, unlimited, offline, but
  #           NOT reproducible: CUDA matmul reduction order varies, so the same corpus
  #           re-embedded yields slightly different vectors and UMAP amplifies that into
  #           different cluster counts (241 -> 231 -> 226 for one identical corpus).
  # gemini  -> hosted Gemini embeddings. Deterministic, so it removes that variance --
  #           but it is rate limited, it can fail mid-run, and EVERY threshold in this
  #           file was calibrated against bge's cosine bands (trigger p10=0.496
  #           p50=0.550 p90=0.613, response p50=0.635). Switching backends invalidates
  #           all of them until they are re-derived. This is not a drop-in.
  backend: local

  gemini_model: gemini-embedding-2

  # Native output is 3072. The model is Matryoshka-trained, so a shorter vector is a
  # truncation of the same one -- which means ONE api call yields every level and the
  # levels can be compared for free.
  #
  # 768 is not a downgrade by default, it is what the rest of this system is built for:
  # Pinecone index narens-brain is a 768-dim index, and the Layer A clause matrix at
  # 74k x 3072 float32 is 867 MiB against 217 MiB -- on a box where spaCy's CONTIGUOUS
  # 392 MiB allocation already fails intermittently from address-space fragmentation.
  # Raise it only if the labelled-sample comparison shows 3072 genuinely separates
  # better, not on the assumption that more dimensions must be better.
  gemini_dimensions: 768

  # Inputs per request. The binding quota is tokens-per-minute, not requests-per-minute:
  # at ~25 tokens a clause this packs ~2500 tokens per request, so 30k TPM allows about
  # 12 requests/min and RPM is never approached.
  gemini_batch_size: 100
